logging:
  level:
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: DEBUG

spring:
  ai:
    openai:
      base-url: ${OPENAI_BASE_URL}
      api-key: ${OPENAI_API_KEY}
      chat:
        model: ${CHAT_MODEL:llama4:latest}

kirinuki:
  pipeline:
    media:
      frame-interval: 15s
      timeout: 1h
    asr:
      model: base.en
      device: cpu
      compute-type: int8
      timeout: 2h
    scoring:
      top-clips: 8
      min-score: 20
      timeout: 2h
    content:
      temperature: 0.7
      max-tokens: 4096
    edit:
      enabled: true
      plan-model: ${EDIT_PLAN_MODEL:${CHAT_MODEL:llama4:latest}}
      plan-temperature: 0.4
      plan-max-tokens: 4096
