logging:
  level:
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: DEBUG

kirinuki:
  pipeline:
    media:
      frame-interval: 15s
      timeout: 1h
    asr:
      model: base.en
      device: cpu
      compute-type: int8
      timeout: 2h
    scoring:
      top-clips: 8
      min-score: 50
      timeout: 2h
    edit:
      enabled: true
      plan-model: ${EDIT_PLAN_MODEL:${CHAT_MODEL:llama4:latest}}
      plan-temperature: 0.4
      plan-max-tokens: 2048
