spring:
  ai:
    ollama:
      chat:
        model: gemma3
        num-thread: 6
        num-ctx: 4096
        num-predict: 300

kirinuki:
  pipeline:
    media:
      frame-interval: 15s
      timeout: 1h
    asr:
      model: base.en
      device: cpu
      compute-type: int8
      timeout: 2h
    scoring:
      top-clips: 8
      timeout: 2h
