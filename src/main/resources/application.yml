spring:
  application:
    name: kirinuki

  profiles:
    default: local

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  mvc:
    problemdetails:
      enabled: true

  flyway:
    enabled: true

  ai:
    openai:
      base-url: ${SEKISHO_URL}
      api-key: placeholder-jwt-injected
      chat:
        model: ${SEKISHO_MODEL:llama4:latest}
        max-tokens: 512

sekisho:
  client:
    token-uri: ${INKAN_TOKEN_URI}
    client-id: ${SEKISHO_CLIENT_ID}
    client-secret: ${SEKISHO_CLIENT_SECRET}
    scope: models.invoke
  timeout: 5m

server:
  port: 8080

management:
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
    logging:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/logs
  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    ai.dashaun.kirinuki: INFO

kirinuki:
  storage:
    root: ./storage
  yt-dlp:
    binary: yt-dlp
    metadata-timeout: 60s
    download-timeout: 30m
