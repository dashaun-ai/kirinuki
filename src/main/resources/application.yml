spring:
  application:
    name: kirinuki

  profiles:
    default: local

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/kirinuki}
    username: ${DATABASE_USERNAME:kirinuki}
    password: ${DATABASE_PASSWORD:kirinuki}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  mvc:
    problemdetails:
      enabled: true

  flyway:
    enabled: true

  ai:
    openai:
      base-url: ${OPENAI_BASE_URL}
      api-key: ${OPENAI_API_KEY}
      chat:
        model: ${CHAT_MODEL:llama4:latest}
        max-tokens: 512

server:
  port: 8080

management:
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
    logging:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/logs
  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    ai.dashaun.kirinuki: INFO

kirinuki:
  storage:
    root: ./storage
  yt-dlp:
    binary: yt-dlp
    metadata-timeout: 60s
    download-timeout: 30m
