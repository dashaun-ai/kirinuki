<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Kirinuki — something went wrong</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=Shippori+Mincho:wght@500&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<header class="topbar">
    <div class="topbar-inner">
        <a class="brand" th:href="@{/}">
            <span class="kanji">切り抜き</span>
            <span class="wordmark">KIRINUKI</span>
        </a>
    </div>
</header>

<main class="page">
    <div class="error-hero">
        <div class="status" th:text="${status}">500</div>
        <h1 th:text="${title}">Something went wrong</h1>
        <div class="detail" th:text="${detail}">An unexpected error occurred.</div>
        <a class="btn btn-ghost" th:href="@{/}">← Back to library</a>
    </div>
</main>
</body>
</html>
