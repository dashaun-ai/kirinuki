spring:
  ai:
    ollama:
      chat:
        model: gemma3:12b

kirinuki:
  pipeline:
    media:
      frame-interval: 5s
      timeout: 20m
    asr:
      model: large-v3
      device: cuda
      compute-type: float16
      timeout: 30m
    scoring:
      candidates-per-request: 25
      top-clips: 8
      timeout: 20m
