kirinuki:
  pipeline:
    media:
      frame-interval: 5s
      timeout: 20m
    asr:
      model: large-v3
      device: cuda
      compute-type: float16
      timeout: 30m
    scoring:
      top-clips: 8
      min-score: 50
      timeout: 20m
    edit:
      enabled: true
      plan-model: ${EDIT_PLAN_MODEL:${CHAT_MODEL:llama4:latest}}
      plan-temperature: 0.4
      plan-max-tokens: 2048
