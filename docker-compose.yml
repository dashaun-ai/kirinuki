services:
  postgres:
    image: postgres:17-alpine
    container_name: kirinuki-postgres
    environment:
      POSTGRES_DB: kirinuki
      POSTGRES_USER: kirinuki
      POSTGRES_PASSWORD: kirinuki
    ports:
      - "5432:5432"
    volumes:
      - kirinuki-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kirinuki"]
      interval: 10s
      timeout: 5s
      retries: 5

  lgtm:
    image: 'grafana/otel-lgtm:latest'
    container_name: kirinuki-lgtm
    ports:
      - '3000:3000'
      - '4317:4317'
      - '4318:4318'
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:13133/ready && curl -sf http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  kirinuki-postgres: